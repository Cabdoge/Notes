name: Build and Release PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        note:
          - { dir: "动力系统笔记",         file: "动力系统笔记.tex" }
          - { dir: "动力系统大作业",        file: "动力系统大作业.tex" }
          - { dir: "基础拓扑学笔记",        file: "基础拓扑学笔记.tex" }
          - { dir: "微分几何笔记",          file: "微分几何笔记.tex" }
          - { dir: "微分几何答题总结",       file: "DifferentialGeometry_Review.tex" }
          - { dir: "泛函分析教材翻译",       file: "泛函分析教材翻译.tex" }
          - { dir: "泛函分析笔记",          file: "泛函分析笔记.tex" }
          - { dir: "群与代数表示论教材翻译", file: "群与代数表示论教材翻译.tex" }
          - { dir: "群与代数表示论笔记",    file: "群与代数表示论笔记.tex" }
          - { dir: "示例",                  file: "示例.tex" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.note.dir }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.note.dir }}/${{ matrix.note.file }}
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          pre_compile: |
            mkdir -p /usr/local/share/fonts/chinese
            find /github/workspace/字体 \( -name "*.TTF" -o -name "*.TTC" \) -exec cp {} /usr/local/share/fonts/chinese/ \;
            fc-cache -fv

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.note.dir }}
          path: ${{ matrix.note.dir }}/*.pdf
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    needs: compile
    if: always()

    steps:
      - name: Get current timestamp
        id: timestamp
        run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Download all PDF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          merge-multiple: true
          path: /tmp/pdfs

      - name: List collected PDFs
        run: ls -lh /tmp/pdfs/

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Notes PDFs (Latest Build)"
          body: |
            自动编译的笔记 PDF 文件，随每次推送自动更新。

            Automatically compiled PDF notes, updated on every push.

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Build time:** ${{ steps.timestamp.outputs.value }}
          files: /tmp/pdfs/*.pdf
          make_latest: true
          prerelease: false
