name: Release PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-pdfs
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect PDFs (keep structure)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          rsync -av --prune-empty-dirs --include='*/' --include='*.pdf' --exclude='*' ./ dist/ || true

          if ! find dist -type f -name '*.pdf' | grep -q .; then
            echo "No PDFs found. Nothing to release."
            exit 1
          fi

      - name: Create ZIP bundle
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          zip -r ../pdfs.zip .
          cd ..

      - name: Prepare uniquely-named single-file assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf assets
          mkdir -p assets

          # 展平目录并把 '/' 替换为 '__'
          while IFS= read -r -d '' f; do
            rel="${f#dist/}"
            out="${rel//\//__}"
            cp -f "$f" "assets/$out"
          done < <(find dist -type f -name '*.pdf' -print0)

      - name: Publish/Update GitHub Release (Using Native API)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "1. 清理旧版本与标签..."
          gh release delete latest --cleanup-tag -y || true
          git push --delete origin latest || true
          
          echo "等待 5 秒，让 GitHub 后端同步删除状态..."
          sleep 5
          
          echo "2. 创建一个【空】的 Release..."
          gh release create latest \
            --title "latest" \
            --notes "Auto-updated PDFs from repository push. Commit: ${{ github.sha }}"
            
          echo "获取新 Release 的 ID..."
          REL_ID=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.id')
          
          echo "等待 5 秒，让上传服务器同步新 ID (避开 404 坑)..."
          sleep 5
          
          echo "3. 开始使用 curl 逐个上传附件 (绕过 gh CLI 中文乱码 Bug)..."
          
          # 上传压缩包
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"pdfs.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=pdfs.zip"
          
          # 循环上传中文 PDF
          for file in assets/*.pdf; do
            filename=$(basename "$file")
            echo "正在上传: $filename"
            
            # 核心魔法：使用 jq 对中文文件名进行标准的 URL 编码 (转成 %E5%8A%A8... 格式)
            encoded_name=$(jq -rn --arg x "$filename" '$x|@uri')
            
            # 直接调用底层 API 上传，彻底保留中文名
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/pdf" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=$encoded_name")
              
            if [ "$HTTP_STATUS" -ne 201 ]; then
              echo "❌ 上传失败: $filename (HTTP 状态码: $HTTP_STATUS)"
              exit 1
            else
              echo "✅ 上传成功: $filename"
            fi
          done
          
          echo "🎉 所有文件原生中文名上传完毕！"
