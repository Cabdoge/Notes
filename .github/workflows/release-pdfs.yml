name: Release PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-pdfs
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect PDFs (keep structure)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          rsync -av --prune-empty-dirs --include='*/' --include='*.pdf' --exclude='*' ./ dist/ || true

          if ! find dist -type f -name '*.pdf' | grep -q .; then
            echo "No PDFs found. Nothing to release."
            exit 1
          fi

      - name: Create ZIP bundle
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          zip -r ../pdfs.zip .
          cd ..

      - name: Prepare uniquely-named single-file assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf assets
          mkdir -p assets

          # 展平目录并把 '/' 替换为 '__'
          while IFS= read -r -d '' f; do
            rel="${f#dist/}"
            out="${rel//\//__}"
            cp -f "$f" "assets/$out"
          done < <(find dist -type f -name '*.pdf' -print0)

      - name: Publish/Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "1. 清理旧版本与标签..."
          gh release delete latest --cleanup-tag -y || true
          git push --delete origin latest || true
          
          echo "等待 5 秒..."
          sleep 5
          
          echo "2. 创建空 Release..."
          gh release create latest \
            --title "latest" \
            --notes "Auto-updated PDFs from repository push. Commit: ${{ github.sha }}"
            
          echo "等待 5 秒..."
          sleep 5
          
          echo "3. 开始逐个上传附件 (使用 Label 机制绕过 GitHub 中文限制)..."
          gh release upload latest pdfs.zip
          
          count=1
          for file in assets/*.pdf; do
            # 提取原有的中文文件名
            original_name=$(basename "$file")
            
            # 过滤掉原名中的 '#' 防止破坏 CLI 的 label 语法
            safe_label="${original_name//#/_}"
            
            # 强制生成纯英文物理文件名，彻底杜绝 422 冲突
            ascii_name="doc_${count}.pdf"
            mv "$file" "assets/$ascii_name"
            
            echo "正在上传: $safe_label (底层物理名: $ascii_name)"
            
            # 使用官方语法: 物理路径#显示标签
            gh release upload latest "assets/$ascii_name#$safe_label"
            
            count=$((count+1))
          done
          
          echo "🎉 所有文件均已利用 Label 伪装上传完毕！"
