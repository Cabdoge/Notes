name: Release PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-pdfs
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect PDFs (keep structure)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          rsync -av --prune-empty-dirs --include='*/' --include='*.pdf' --exclude='*' ./ dist/ || true

          echo "Found PDFs:"
          find dist -type f -name '*.pdf' -print || true

          if ! find dist -type f -name '*.pdf' | grep -q .; then
            echo "No PDFs found. Nothing to release."
            exit 1
          fi

      - name: Create ZIP bundle
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          zip -r ../pdfs.zip .
          cd ..
          ls -lah pdfs.zip

      - name: Prepare uniquely-named single-file assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf assets
          mkdir -p assets

          # For each pdf under dist/, create a uniquely named copy in assets/
          # Name rule: replace '/' with '__' to encode path into filename.
          while IFS= read -r -d '' f; do
            rel="${f#dist/}"          # relative path inside dist
            out="${rel//\//__}"       # encode path separators
            cp -f "$f" "assets/$out"
          done < <(find dist -type f -name '*.pdf' -print0)

          echo "Prepared assets:"
          ls -lah assets | sed -n '1,200p'

          # Safety check: ensure no duplicate names in assets/
          dup="$(ls assets | sort | uniq -d || true)"
          if [ -n "$dup" ]; then
            echo "ERROR: duplicate asset names still exist:"
            echo "$dup"
            exit 1
          fi

      - name: "Publish/Update GitHub Release (tag: latest)"
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: latest
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: |
            pdfs.zip
            dist/**/*.pdf
          body: |
            Auto-updated PDFs from repository push.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
