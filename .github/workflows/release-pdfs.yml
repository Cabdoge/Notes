name: Release PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-pdfs
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect PDFs (keep structure)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          rsync -av --prune-empty-dirs --include='*/' --include='*.pdf' --exclude='*' ./ dist/ || true

          echo "Found PDFs:"
          find dist -type f -name '*.pdf' -print || true

          if ! find dist -type f -name '*.pdf' | grep -q .; then
            echo "No PDFs found. Nothing to release."
            exit 1
          fi

      - name: Create ZIP bundle
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          zip -r ../pdfs.zip .
          cd ..
          ls -lah pdfs.zip

      - name: Prepare uniquely-named single-file assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf assets
          mkdir -p assets

          # For each pdf under dist/, create a uniquely named copy in assets/
          # Name rule: replace '/' with '__' to encode path into filename.
          while IFS= read -r -d '' f; do
            rel="${f#dist/}"          # relative path inside dist
            out="${rel//\//__}"       # encode path separators
            cp -f "$f" "assets/$out"
          done < <(find dist -type f -name '*.pdf' -print0)

          echo "Prepared assets:"
          ls -lah assets | sed -n '1,200p'

          # Safety check: ensure no duplicate names in assets/
          dup="$(ls assets | sort | uniq -d || true)"
          if [ -n "$dup" ]; then
            echo "ERROR: duplicate asset names still exist:"
            echo "$dup"
            exit 1
          fi

      - name: Publish/Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "1. 清理旧版本与标签..."
          gh release delete latest --cleanup-tag -y || true
          git push --delete origin latest || true
          
          echo "等待 5 秒，让 GitHub 后端同步删除状态..."
          sleep 5
          
          echo "2. 创建一个【空】的 Release..."
          gh release create latest \
            --title "latest" \
            --notes "Auto-updated PDFs from repository push. Commit: ${{ github.sha }}"
            
          echo "等待 5 秒，让 GitHub 上传服务器识别新生成的 Release ID..."
          sleep 5
          
          echo "3. 开始逐个上传附件..."
          gh release upload latest pdfs.zip
          
          # 使用 for 循环逐个单线程上传 PDF，避免并发请求引发 404 或拦截
          for file in assets/*.pdf; do
            echo "正在上传: $file"
            gh release upload latest "$file"
          done
          
          echo "所有文件上传完毕！"
